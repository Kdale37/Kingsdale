name: Publish Danish benchmark
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: [Benchmark Danish prose]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test runner and frontend
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/frontend.test.cjs
          python3 scripts/benchmark.py validate
      - name: Prepare public files only
        run: |
          mkdir -p public-site/data
          cp index.html styles.css app.js .nojekyll public-site/
          cp data/catalog.json data/results.json public-site/data/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
