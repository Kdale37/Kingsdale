name: Benchmark Danish prose
on:
  workflow_dispatch:
    inputs:
      budget_dkk:
        description: Budget for this result set, max 100 DKK (existing spend retained)
        default: '100'
        required: true
      usd_dkk_rate:
        description: Conservative planning exchange rate, not a live quotation
        default: '8'
        required: true
      models:
        description: Optional comma-separated model IDs for a pilot (empty runs all price-verified models)
        default: ''
      retry_failed:
        description: Retry failed samples only after correcting prerequisites and checking billing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paid-danish-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check credential presence without revealing it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,sys
          missing = [name for name in ('HF_TOKEN','OPENAI_API_KEY') if not os.environ.get(name)]
          if missing:
              sys.exit('Missing repository secrets: ' + ', '.join(missing))
          PY
      - name: Update catalogue and run or resume
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCH_BUDGET: ${{ inputs.budget_dkk }}
          BENCH_RATE: ${{ inputs.usd_dkk_rate }}
          BENCH_MODELS: ${{ inputs.models }}
          BENCH_RETRY: ${{ inputs.retry_failed }}
        run: |
          python3 scripts/benchmark.py catalog --backend huggingface
          python3 - <<'PY'
          import os, subprocess
          command = ['python3','scripts/benchmark.py','run','--backend','huggingface',
                     '--budget-dkk',os.environ['BENCH_BUDGET'],'--usd-dkk-rate',os.environ['BENCH_RATE']]
          if os.environ.get('BENCH_MODELS'):
              command += ['--models', os.environ['BENCH_MODELS']]
          if os.environ.get('BENCH_RETRY') == 'true':
              command += ['--retry-failed']
          subprocess.run(command, check=True)
          PY
      - name: Preserve results and spending reservations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-data-${{ github.run_id }}
          path: data/*.json
          retention-days: 90
      - name: Publish data checkpoint, including partial runs
        if: always()
        run: |
          python3 scripts/benchmark.py validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Danish benchmark data and spending checkpoint'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
