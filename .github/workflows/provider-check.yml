name: Check Hugging Face and OpenAI access
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paid-danish-benchmark
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only access and public price check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/check_providers.py
      - name: Save public catalogue metadata
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/provider-preflight.json
          if [ -f data/hf-pricing-snapshot.json ]; then
            git add data/hf-pricing-snapshot.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Save public Hugging Face price snapshot after read-only access checks'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
